<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>TABRANIJ Pro v3.1 — TARI</title></head>
<body>
<p style="font-family:sans-serif;color:#888;padding:20px">Loading Tabranij Pro v3.1 (TARI)…</p>
<script src="p0.js"></script>
<script src="p1.js"></script>
<script src="p2.js"></script>
<script src="p3.js"></script>
<script>
window.__TB64=window.__P0+window.__P1+window.__P2+window.__P3;
async function go(){
  const bin=Uint8Array.from(atob(window.__TB64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream("gzip");
  const ab=await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
  document.open();document.write(new TextDecoder().decode(ab));document.close();
}
go().catch(e=>{document.body.innerHTML="<pre style=color:red>"+e+"\n\npython3 -m http.server 8080</pre>"});
</script>
</body></html>
